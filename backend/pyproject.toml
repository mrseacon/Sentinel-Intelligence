[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Sentinel backend: sentinel_core (domain logic) + sentinel_api (FastAPI)"
requires-python = ">=3.11"
# All versions are pinned exactly (project frozen, see HANDOVER.md): a
# rebuild months from now must resolve to the same tree. Transitive
# dependencies are pinned in requirements.txt / requirements-dev.txt.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    # Price data source per ARCHITECTURE.md §2; pandas is used directly
    # by sentinel_core (returns/covariance work on DataFrames).
    "pandas==3.0.6",
    "yfinance==1.7.0",
    # First consumer-shared scientific dependency: SLSQP for the
    # max-Sharpe optimizer (KNOWLEDGE_EXTRACTION §11) and norm.pdf/ppf
    # for the parametric CVaR (§4).
    "scipy==1.18.1",
    # News RSS fetching (KNOWLEDGE_EXTRACTION §9). Already a transitive
    # dependency via yfinance — declared explicitly because sentinel_core
    # imports it directly. NOTE: 'anthropic' is deliberately NOT listed —
    # it is an optional dependency, lazy-imported in ai/llm_client.py
    # (graceful degradation, §8; AI is also gated behind the
    # SENTINEL_AI_ENABLED feature flag, default off).
    "requests==2.34.2",
    # Required by FastAPI/Starlette to parse multipart/form-data bodies
    # (POST /portfolio/upload, API_CONTRACT §2.12a).
    "python-multipart==0.0.32",
    # PDF generation for POST /reports/risk-summary. Chosen over WeasyPrint
    # (HTML/CSS -> PDF, would let us reuse frontend styling) because
    # WeasyPrint needs system libraries (Pango/Cairo/GDK) that Render's
    # Python runtime doesn't provide without a Dockerfile — reportlab is
    # pure Python, zero system dependencies, and fits the existing
    # buildpack deploy (render.yaml/railway.json, ARCHITECTURE §8).
    "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
    "black==26.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Don't rely on the editable install's .pth: Python 3.13 skips .pth files
# carrying the macOS hidden flag, which a local tool sets on everything
# under dot-directories like .venv (same lesson as legacy CI, §15).
pythonpath = ["src"]
